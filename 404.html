<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
404 | Page Not Found
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--bg:#090909;
--red:#c92b2b;
--white:#ffffff;
--soft:#d0d0d0;

}

body{

font-family:Arial,sans-serif;

background:

linear-gradient(
rgba(0,0,0,.82),
rgba(0,0,0,.92)
),

url("banner.jpg");

background-size:cover;
background-position:center;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:40px;

color:white;

text-align:center;

}

.container{

max-width:850px;

padding:60px;

background:
rgba(10,10,10,.80);

border-radius:25px;

backdrop-filter:blur(6px);

border:
1px solid
rgba(255,255,255,.08);

}

.error{

font-size:clamp(
5rem,
15vw,
10rem
);

font-weight:bold;

color:var(--red);

line-height:1;

margin-bottom:25px;

}

h1{

font-size:2.4rem;

margin-bottom:30px;

}

p{

font-size:1.1rem;

color:var(--soft);

line-height:1.9;

margin-bottom:40px;

}

.quote{

padding:30px;

background:#151515;

border-left:
4px solid var(--red);

margin-bottom:45px;

font-style:italic;

}

.buttons{

display:flex;

justify-content:center;

gap:20px;

flex-wrap:wrap;

}

.buttons a{

text-decoration:none;

padding:16px 35px;

border-radius:50px;

font-weight:bold;

transition:.4s;

}

.home{

background:var(--red);

color:white;

}

.contents{

border:
1px solid white;

color:white;

}

.buttons a:hover{

transform:translateY(-5px);

}

</style>

</head>

<body>


<div class="container">

<div class="error">

404

</div>

<h1>

Words may travel farther than expected

</h1>

<p>

The page you tried to reach could not be found. A link may have changed, a page may have moved, or the destination may never have existed.

</p>

<div class="quote">

"Every word leaves something behind."

</div>


<div class="buttons">

<a
href="index.html"
class="home">

Return Home

</a>

<a
href="contents.html"
class="contents">

Table of Contents

</a>

</div>

</div>


</body>

</html>
